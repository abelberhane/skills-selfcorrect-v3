name: Step 6

on:
  push:
    # The exercise is copied by pushing to main, so main must stay ignored or every
    # step workflow fires at once on repository creation. Learners work on a branch.
    branches-ignore:
      - main
      - 'copilot-instruction/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: read

env:
  STEP_NEXT_FILE: ".github/steps/7-step.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.1

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.1

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v3
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      # START: Check practical exercise

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read repository settings
        id: settings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A missing ruleset or protection entry means the learner has not set it up yet.
          protected=$(gh api "repos/${{ github.repository }}/rulesets" --jq '[.[] | select(.target=="branch")] | length' 2>/dev/null || echo 0)
          legacy=$(gh api "repos/${{ github.repository }}/branches/main/protection" --jq '.required_status_checks.contexts | length' 2>/dev/null || echo 0)
          automerge=$(gh api "repos/${{ github.repository }}" --jq '.allow_auto_merge' 2>/dev/null || echo false)
          if [ "$protected" != "0" ] || [ "$legacy" != "0" ]; then echo "main_protected=true" >> "$GITHUB_OUTPUT"; else echo "main_protected=false" >> "$GITHUB_OUTPUT"; fi
          echo "auto_merge=$automerge" >> "$GITHUB_OUTPUT"

      - name: Check step 6
        id: check-step
        continue-on-error: true
        env:
          MAIN_PROTECTED: ${{ steps.settings.outputs.main_protected }}
          AUTO_MERGE_ALLOWED: ${{ steps.settings.outputs.auto_merge }}
        run: npm run check-step -- 6

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 6
            results_table:
              - description: "The main branch requires the evaluator check and auto-merge is allowed"
                passed: ${{ steps.check-step.outcome == 'success' }}
            tips:
              - "The status check only appears in the ruleset picker after it has run once."
              - "Do not add a bypass list. Auto-merge should queue, never override."

      # END: Check practical exercise

      - name: Fail job if check failed
        if: ${{ steps.check-step.outcome != 'success' }}
        run: exit 1

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.1

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 7

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_NEXT_FILE }}
          vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{ github.workflow }}"
          gh workflow enable "Step 7"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
