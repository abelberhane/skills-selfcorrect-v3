name: Step 1

on:
  push:
    # The exercise is copied by pushing to main, so main must stay ignored or every
    # step workflow fires at once on repository creation. Learners work on a branch.
    branches-ignore:
      - main
      - 'copilot-instruction/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: read

env:
  STEP_NEXT_FILE: ".github/steps/2-step.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.1

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.1

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v3
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      # START: Check practical exercise

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check step 1
        id: check-step
        continue-on-error: true
        run: npm run check-step -- 1

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 1
            results_table:
              - description: "A new maintainer rule was added in the maintainer-controlled section"
                passed: ${{ steps.check-step.outcome == 'success' }}
            tips:
              - "Add your rule above the `<!-- learned-rules:start -->` marker."
              - "The Learned rules section should stay untouched in this step."

      # END: Check practical exercise

      - name: Fail job if check failed
        if: ${{ steps.check-step.outcome != 'success' }}
        run: exit 1

  create_review_pull_request:
    name: Create the pull request to review
    needs: [check_step_work]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Open the add-discount pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: re-running this step must not open a second pull request.
          if gh pr list --head add-discount --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo "The review pull request already exists."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c add-discount origin/${{ github.event.repository.default_branch }}
          node scripts/open-review-pr.js src/cart.js
          git add src/cart.js
          git commit -m "Add applyDiscount to the cart module"
          git push -f origin add-discount
          if ! gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head add-discount \
            --title "Add applyDiscount to the cart module" \
            --body "Adds a percentage discount helper to the cart.

          Ready for review." \
            --label copilot-authored
          then
            echo "::error::Could not open the review pull request. In Settings > Actions > General, under Workflow permissions, select 'Allow GitHub Actions to create and approve pull requests', then re-run this job."
            exit 1
          fi

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work, create_review_pull_request]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.1

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 2

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_NEXT_FILE }}
          vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{ github.workflow }}"
          gh workflow enable "Step 2"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
